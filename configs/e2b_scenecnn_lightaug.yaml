# e1 + light augmentation only (reflect-pad random crop + h-flip). Follow-up: strong aug in e2 made the model underfit.
name: e2b_scenecnn_lightaug
data: {img_size: 128, channels: 3, augment: light, val_fraction: 0.2, split_seed: 0}
model: {name: scenecnn, width: 32, dropout: 0.3}
train:
  epochs: 60
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.001, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 2
