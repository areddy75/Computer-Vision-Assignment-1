# Resolution study: e5 recipe at 288x288 (~1.65x the FLOPs of 224). Source images are 256x256, so this upsamples.
name: e13_r18_res288
data: {img_size: 288, channels: 3, augment: strong, val_fraction: 0.2, split_seed: 0}
model: {name: resnet18, pretrained: true, dropout: 0.0}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
