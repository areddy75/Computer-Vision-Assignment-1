# e5 with light augmentation (pad-crop + flip) instead of strong. Does the pretrained model need strong aug?
name: e5b_r18_lightaug
data: {img_size: 224, channels: 3, augment: light, val_fraction: 0.2, split_seed: 0}
model: {name: resnet18, pretrained: true, dropout: 0.0}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
