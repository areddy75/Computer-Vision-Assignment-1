# EfficientNet-B0 (e9) at 288x288: resolution helped ResNet-18 (+1.4% at 288 vs 224 mean).
name: e15_effb0_res288
data: {img_size: 288, channels: 3, augment: strong, val_fraction: 0.2, split_seed: 0}
model: {name: efficientnet_b0, pretrained: true, dropout: 0.0}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
