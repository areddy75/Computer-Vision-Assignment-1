# ResNet-18 from random init, 224x224, strong augmentation. Control for e4 (ImageNet init).
name: e3_resnet18_scratch
data: {img_size: 224, channels: 3, augment: strong, val_fraction: 0.2, split_seed: 0}
model: {name: resnet18, pretrained: false, dropout: 0.0}
train:
  epochs: 60
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.001, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 2
