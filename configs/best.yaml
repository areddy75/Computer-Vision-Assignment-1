# FINAL MODEL (selected on validation accuracy only, before any test-set evaluation).
# Identical to e16_convnext_lightaug.yaml: ConvNeXt-Tiny (ImageNet-1k), all layers fine-tuned, 224px, light aug,
# AdamW lr 1e-4 wd 0.05, cosine + 1 warm-up epoch, label smoothing 0.1, 30 epochs, batch 32. Val acc 0.9667 (epoch 16).
name: e16_convnext_lightaug
data: {img_size: 224, channels: 3, augment: light, val_fraction: 0.2, split_seed: 0}
model: {name: convnext_tiny, pretrained: true, dropout: 0.0}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.0001, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
