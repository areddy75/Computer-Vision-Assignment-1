# e8 with lr 1e-4: e8's val accuracy oscillated (91-94%) mid-training, suggesting 3e-4 is too high for ConvNeXt fine-tuning.
name: e8b_convnext_tiny_lr1e-4
data: {img_size: 224, channels: 3, augment: strong, val_fraction: 0.2, split_seed: 0}
model: {name: convnext_tiny, pretrained: true, dropout: 0.0}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.0001, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
