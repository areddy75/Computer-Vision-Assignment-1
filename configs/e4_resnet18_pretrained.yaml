# ResNet-18 initialised from ImageNet-1k, all layers fine-tuned. Same recipe as e3 except a lower LR
# (fine-tuning with 1e-3 destroys pretrained features) and fewer epochs (converges much faster).
name: e4_resnet18_pretrained
data: {img_size: 224, channels: 3, augment: strong, val_fraction: 0.2, split_seed: 0}
model: {name: resnet18, pretrained: true, dropout: 0.0}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 1
