# Efficient final candidate: ResNet-18 at 288 (e13) + light augmentation (e5b).
name: e17_r18_288_lightaug
data: {img_size: 288, channels: 3, augment: light, val_fraction: 0.2, split_seed: 0}
model: {name: resnet18, pretrained: true, dropout: 0.0}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.0003, weight_decay: 0.05}
  schedule: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
