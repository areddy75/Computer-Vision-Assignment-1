# e5 but backbone frozen: only the linear head is trained (tests how far ImageNet features transfer as-is).
name: e7_r18_linearprobe
data: {img_size: 224, channels: 3, augment: strong, val_fraction: 0.2, split_seed: 0}
model: {name: resnet18, pretrained: true, dropout: 0.0, freeze_backbone: true}
train:
  epochs: 30
  batch_size: 32
  seed: 0
  optimizer: {name: adamw, lr: 0.003, weight_decay: 0.0}
  schedule: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
